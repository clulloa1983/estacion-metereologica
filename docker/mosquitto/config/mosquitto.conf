# Non-secure MQTT listener (for development/backward compatibility)
listener 1883
allow_anonymous true
protocol mqtt

# Secure MQTT TLS listener
listener 8883
allow_anonymous false
protocol mqtt
cafile /mosquitto/ssl/ca.crt
certfile /mosquitto/ssl/server.crt
keyfile /mosquitto/ssl/server.key
tls_version tlsv1.2
require_certificate false
use_identity_as_username true

# WebSocket listener (non-secure for development)
listener 9001
protocol websockets
allow_anonymous true

# WebSocket secure listener
listener 9002
protocol websockets
cafile /mosquitto/ssl/ca.crt
certfile /mosquitto/ssl/server.crt
keyfile /mosquitto/ssl/server.key

# Data persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type all
connection_messages true
log_timestamp true

# Security
max_connections 100
max_inflight_messages 10
max_queued_messages 100

# Authentication (will be configured for production)
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl