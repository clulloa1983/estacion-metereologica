name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # Backend testing and linting
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      
      influxdb:
        image: influxdb:2.7
        env:
          INFLUXDB_DB: test_weather
          INFLUXDB_ADMIN_USER: admin
          INFLUXDB_ADMIN_PASSWORD: admintest123
          INFLUXDB_USER: weather
          INFLUXDB_USER_PASSWORD: weathertest123
        options: >-
          --health-cmd "influx ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 8086:8086
          
      mosquitto:
        image: eclipse-mosquitto:2.0
        ports:
          - 1883:1883
          - 9001:9001

    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Create test environment file
      run: |
        cat > .env.test << EOF
        NODE_ENV=test
        PORT=5002
        INFLUXDB_URL=http://localhost:8086
        INFLUXDB_TOKEN=test-token-123
        INFLUXDB_ORG=test-org
        INFLUXDB_BUCKET=test-bucket
        MQTT_BROKER_URL=mqtt://localhost:1883
        REDIS_URL=redis://localhost:6379
        JWT_SECRET=test-jwt-secret-key-for-testing-only
        LOG_LEVEL=error
        EOF

    - name: Wait for services to be ready
      run: |
        echo "Waiting for Redis..."
        timeout 30 sh -c 'until nc -z localhost 6379; do sleep 1; done'
        echo "Waiting for InfluxDB..."
        timeout 30 sh -c 'until nc -z localhost 8086; do sleep 1; done'
        echo "Waiting for MQTT..."
        timeout 30 sh -c 'until nc -z localhost 1883; do sleep 1; done'

    - name: Run linting
      run: |
        if [ -f ".eslintrc.js" ] || [ -f ".eslintrc.json" ]; then
          npm run lint || echo "Linting not configured"
        else
          echo "ESLint not configured, skipping..."
        fi

    - name: Run unit tests
      run: npm test
      env:
        CI: true

    - name: Run integration tests
      run: npm test -- --testPathPattern=integration
      env:
        CI: true

    - name: Generate test coverage
      run: npm run test:coverage || npm test -- --coverage
      env:
        CI: true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./backend/coverage/lcov.info
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false

  # Frontend testing and linting
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Create environment file
      run: |
        cat > .env.local << EOF
        NEXT_PUBLIC_API_URL=http://localhost:5002/api
        NODE_ENV=test
        EOF

    - name: Run linting
      run: |
        if [ -f ".eslintrc.js" ] || [ -f ".eslintrc.json" ]; then
          npm run lint || echo "Linting not configured"
        else
          echo "ESLint not configured, skipping..."
        fi

    - name: Run type checking
      run: |
        if [ -f "tsconfig.json" ]; then
          npx tsc --noEmit || echo "TypeScript check failed"
        else
          echo "TypeScript not configured, skipping..."
        fi

    - name: Run unit tests
      run: npm test
      env:
        CI: true

    - name: Generate test coverage
      run: npm run test:coverage || npm test -- --coverage
      env:
        CI: true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage
        fail_ci_if_error: false

    - name: Build application
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: http://localhost:5002/api

  # Security scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    # Backend dependency audit
    - name: Backend dependency audit
      run: |
        cd backend
        npm audit --audit-level=moderate
      continue-on-error: true

    # Frontend dependency audit
    - name: Frontend dependency audit
      run: |
        cd frontend
        npm audit --audit-level=moderate
      continue-on-error: true

  # Docker build and test
  docker-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build backend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: false
        tags: weather-backend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build frontend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: false
        tags: weather-frontend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          NEXT_PUBLIC_API_URL=http://localhost:5002/api

    - name: Test Docker Compose
      run: |
        # Test that docker-compose configuration is valid
        docker-compose config
        
        # Test that services can start (don't run fully to save time)
        docker-compose up -d --no-deps influxdb redis mosquitto
        sleep 10
        docker-compose ps
        docker-compose down

  # End-to-end tests (only on main branch)
  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [backend-test, frontend-test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Start services with Docker Compose
      run: |
        docker-compose up -d
        # Wait for services to be ready
        sleep 30
        
        # Check service health
        docker-compose ps
        
        # Test backend health
        timeout 60 sh -c 'until curl -f http://localhost:5002/health; do sleep 2; done'

    - name: Install E2E test dependencies
      run: |
        if [ -f "e2e/package.json" ]; then
          cd e2e && npm ci
        else
          echo "No E2E tests configured"
        fi

    - name: Run E2E tests
      run: |
        if [ -f "e2e/package.json" ]; then
          cd e2e && npm test
        else
          echo "No E2E tests to run"
        fi

    - name: Cleanup
      if: always()
      run: docker-compose down -v

  # Deployment (only on main branch and if all tests pass)
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend-test, frontend-test, security-scan, docker-test]
    environment: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup deployment
      run: |
        echo "Deployment would happen here"
        echo "This could include:"
        echo "- Building and pushing Docker images to registry"
        echo "- Deploying to Kubernetes cluster"
        echo "- Updating environment configuration"
        echo "- Running smoke tests"

    # Example deployment steps (uncomment and configure as needed)
    # - name: Configure AWS credentials
    #   uses: aws-actions/configure-aws-credentials@v2
    #   with:
    #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
    #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    #     aws-region: us-east-1

    # - name: Login to Amazon ECR
    #   id: login-ecr
    #   uses: aws-actions/amazon-ecr-login@v1

    # - name: Build and push backend image
    #   env:
    #     ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
    #     ECR_REPOSITORY: weather-backend
    #     IMAGE_TAG: ${{ github.sha }}
    #   run: |
    #     docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./backend
    #     docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    # - name: Deploy to ECS
    #   run: |
    #     # Update ECS service with new image
    #     aws ecs update-service --cluster weather-cluster --service weather-backend --force-new-deployment

  # Notification on failure
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    if: failure()
    needs: [backend-test, frontend-test, security-scan, docker-test]

    steps:
    - name: Send failure notification
      run: |
        echo "CI/CD pipeline failed"
        echo "Failed jobs: ${{ toJson(needs) }}"
        # Add Slack, Discord, or email notification here
        # Example:
        # curl -X POST -H 'Content-type: application/json' \
        #   --data '{"text":"Weather Station CI/CD Pipeline Failed: ${{ github.event.head_commit.message }}"}' \
        #   ${{ secrets.SLACK_WEBHOOK_URL }}

# Additional workflow for dependency updates
  dependency-update:
    name: Check Dependencies
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Check for backend updates
      run: |
        cd backend
        npx npm-check-updates --errorLevel 2

    - name: Check for frontend updates
      run: |
        cd frontend
        npx npm-check-updates --errorLevel 2

    - name: Create issue for outdated dependencies
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Outdated Dependencies Detected',
            body: 'Automated dependency check found outdated packages. Please review and update.',
            labels: ['dependencies', 'automated']
          });

# Schedule dependency checks weekly
on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9 AM UTC
  workflow_dispatch:  # Allow manual trigger