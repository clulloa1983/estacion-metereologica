<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976d2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#skyGradient)" stroke="#1565c0" stroke-width="8"/>
  
  <!-- Sun -->
  <circle cx="200" cy="180" r="50" fill="#FFD700" stroke="#FFA500" stroke-width="3"/>
  
  <!-- Cloud -->
  <ellipse cx="280" cy="220" rx="60" ry="35" fill="#FFFFFF" opacity="0.9"/>
  <ellipse cx="250" cy="210" rx="45" ry="30" fill="#FFFFFF" opacity="0.9"/>
  <ellipse cx="310" cy="210" rx="40" ry="25" fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Thermometer -->
  <rect x="350" y="280" width="20" height="120" fill="#FF4444" rx="10"/>
  <circle cx="360" cy="420" r="25" fill="#FF4444"/>
  <rect x="355" y="290" width="10" height="100" fill="#FFFFFF"/>
  
  <!-- Wind lines -->
  <line x1="80" y1="300" x2="150" y2="300" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="320" x2="130" y2="320" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="340" x2="140" y2="340" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Rain drops -->
  <ellipse cx="230" cy="280" rx="3" ry="8" fill="#4FC3F7"/>
  <ellipse cx="250" cy="300" rx="3" ry="8" fill="#4FC3F7"/>
  <ellipse cx="270" cy="285" rx="3" ry="8" fill="#4FC3F7"/>
  <ellipse cx="290" cy="305" rx="3" ry="8" fill="#4FC3F7"/>
  
  <!-- Weather station symbol -->
  <rect x="240" y="380" width="32" height="60" fill="#424242" rx="4"/>
  <circle cx="256" cy="370" r="12" fill="#FF6B35"/>
  <rect x="248" y="350" width="16" height="8" fill="#424242"/>
</svg>