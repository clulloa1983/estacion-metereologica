services:
  influxdb:
    image: influxdb:2.7
    container_name: weather_influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USERNAME:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD:-weather123}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-weather-station}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-weather-data}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN:-weather-station-token-12345}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    networks:
      - weather-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  grafana:
    image: grafana/grafana:latest
    container_name: weather_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-grafana123}
      - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY:-change-this-secret-key}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - weather-network
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: weather_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server
    volumes:
      - redis-data:/data
    networks:
      - weather-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: weather_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/config:/mosquitto/config
      - ./docker/mosquitto/data:/mosquitto/data
      - ./docker/mosquitto/log:/mosquitto/log
    networks:
      - weather-network
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t test -m 'health' -u '' -P '' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  backup-service:
    image: alpine:latest
    container_name: weather_backup_service
    restart: unless-stopped
    environment:
      - BACKUP_HOUR=2  # Hour to run backup (24h format)
      - BACKUP_RETENTION_DAYS=7
      - INFLUXDB_ORG=weather-station
      - INFLUXDB_TOKEN=weather-station-token-12345
      - CONTAINER_NAME=weather_influxdb
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - weather-network
    depends_on:
      influxdb:
        condition: service_healthy
    command: >
      sh -c "
        apk add --no-cache docker-cli curl bash &&
        echo \"Backup service started. Will run daily at 0\$${BACKUP_HOUR}:00\" &&
        while true; do
          current_hour=\$$(date +%H);
          if [ \$$current_hour -eq $${BACKUP_HOUR} ]; then
            if [ ! -f /tmp/backup_done_today ]; then
              echo 'Running scheduled backup...';
              /scripts/backup-simple.sh;
              touch /tmp/backup_done_today;
            fi;
          else
            rm -f /tmp/backup_done_today;
          fi;
          sleep 3600;
        done"

volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:
  redis-data:

networks:
  weather-network:
    driver: bridge